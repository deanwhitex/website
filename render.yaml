services:
  - type: web
    name: kc-builder-pro
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NETLIFY_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kc-builder-db
          property: connectionString

databases:
  - name: kc-builder-db
    databaseName: kcbuilder
    user: kcbuilder
